<section class="card hero hero--short">
  <p class="mono">{{t.about.label}}</p>
  <h1 class="hero__title">{{html t.about.title}}</h1>
  <div class="hero__foot">
    <p class="lead">{{t.about.lead}}</p>
  </div>
</section>

<!-- TEAM: people and photos in site/content.json "team", words in site/lang -->
<section class="team">
  {{#each team}}
  <article class="member member--{{.tone}}">
    <div class="member__portrait">
      {{#if .photo}}<img src="{{.photo}}" alt="{{.name}}" width="800" height="1030" loading="lazy">
      {{else}}<span class="member__soon">{{t.about.photo_soon}}</span>{{/if}}
    </div>
    <div class="member__text">
      <h2>{{.name}}</h2>
      <p class="member__role">{{.role}}</p>
      {{#if .text}}<p>{{.text}}</p>{{/if}}
    </div>
  </article>
  {{/each}}
</section>
